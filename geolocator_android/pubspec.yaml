name: geolocator_android
description: Geolocation plugin for Flutter. This plugin provides the Android implementation for the geolocator.
repository: https://github.com/sumeth-sdk/flutter-geolocator/tree/latest/geolocator_android
issue_tracker: https://github.com/baseflow/flutter-geolocator/issues?q=is%3Aissue+is%3Aopen
version: 5.0.2

environment:
  sdk: ^3.5.0
  flutter: ">=2.17.0"

flutter:
  plugin:
    implements: geolocator
    platforms:
      android:
        package: com.baseflow.geolocator
        pluginClass: GeolocatorPlugin
        dartPluginClass: GeolocatorAndroid

dependencies:
  flutter:
    sdk: flutter
  geolocator_platform_interface: 
    path: ../geolocator_platform_interface
  meta: ^1.17.0
  uuid: ">=4.5.3 <6.0.0"

dev_dependencies:
  async: ^2.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  plugin_platform_interface: ^2.1.8
